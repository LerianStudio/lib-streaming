name: Proto Validation

on:
  pull_request:
    branches: [develop, release-candidate, main]
    types: [opened, synchronize, reopened]
    paths:
      - 'billing/proto/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'Makefile'
      - '.github/workflows/proto-validation.yml'

permissions:
  contents: read

jobs:
  proto:
    name: Proto Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # buf breaking compares against the base branch, so the base history
          # must be present in the checkout.
          fetch-depth: 0
          # This job only reads the tree (lint + breaking check), so the
          # checkout token does not need to persist in the worktree.
          persist-credentials: false
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          # Pinned to match BUF_VERSION in the Makefile so lint/breaking behave
          # identically locally and in CI.
          version: 1.72.0
          github_token: ${{ github.token }}
      - name: Lint protobuf module
        run: make proto-lint
      - name: Check protobuf backward compatibility
        env:
          # Pass the untrusted context value via env (not inline ${{ }}) to avoid
          # shell injection into the run block.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # buf breaking needs a proto MODULE on the base ref to compare against.
          # On the PR that first introduces the module (buf.yaml + the .proto are
          # new), there is nothing to break against and buf errors with
          # "had no .proto files". Skip the check in that case; it engages on every
          # later PR once the module exists on the base branch.
          #
          # First make sure the base ref actually resolves — a lookup failure
          # (missing/unfetched ref) must FAIL the gate, not be mistaken for an
          # absent buf.yaml and silently skipped.
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::Base ref origin/${BASE_REF} could not be resolved (check fetch-depth / base branch)."
            exit 1
          fi
          # Ref resolves — skip ONLY when buf.yaml is genuinely absent on it.
          if git cat-file -e "origin/${BASE_REF}:buf.yaml" 2>/dev/null; then
            make proto-breaking BUF_BREAKING_AGAINST=".git#ref=origin/${BASE_REF}"
          else
            echo "buf.yaml not present on origin/${BASE_REF} — proto module is new in this PR; backward-compatibility check skipped (no baseline to compare)."
          fi
